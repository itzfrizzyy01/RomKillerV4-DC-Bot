openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: dashboard
    description: Control center overview
  - name: settings
    description: Guild configuration
  - name: moderation
    description: Moderation and security operations
  - name: tickets
    description: Ticket operations
  - name: minecraft
    description: Minecraft bridge status
  - name: economy
    description: Economy and leveling
  - name: activity
    description: Audit and notification activity
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /dashboard:
    get:
      operationId: getDashboard
      tags: [dashboard]
      summary: Get control center overview
      responses:
        "200":
          description: Dashboard overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dashboard"
  /settings:
    get:
      operationId: getSettings
      tags: [settings]
      summary: Get guild settings
      responses:
        "200":
          description: Guild settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GuildSettings"
    patch:
      operationId: updateSettings
      tags: [settings]
      summary: Update guild settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GuildSettingsUpdate"
      responses:
        "200":
          description: Updated settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GuildSettings"
  /moderation/cases:
    get:
      operationId: listModerationCases
      tags: [moderation]
      summary: List recent moderation cases
      responses:
        "200":
          description: Recent cases
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ModerationCase"
  /tickets:
    get:
      operationId: listTickets
      tags: [tickets]
      summary: List support tickets
      responses:
        "200":
          description: Tickets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Ticket"
  /minecraft/status:
    get:
      operationId: getMinecraftStatus
      tags: [minecraft]
      summary: Get Minecraft server status
      responses:
        "200":
          description: Minecraft status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MinecraftStatus"
  /economy/summary:
    get:
      operationId: getEconomySummary
      tags: [economy]
      summary: Get economy summary
      responses:
        "200":
          description: Economy summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EconomySummary"
  /activity:
    get:
      operationId: listActivity
      tags: [activity]
      summary: List recent bot activity
      responses:
        "200":
          description: Recent activity
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivityItem"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Dashboard:
      type: object
      required: [bot, guild, modules, metrics]
      properties:
        bot:
          $ref: "#/components/schemas/BotStatus"
        guild:
          $ref: "#/components/schemas/GuildSummary"
        modules:
          type: array
          items:
            $ref: "#/components/schemas/ModuleStatus"
        metrics:
          $ref: "#/components/schemas/Metrics"
    BotStatus:
      type: object
      required: [status, latency, version]
      properties:
        status: { type: string }
        latency: { type: number }
        version: { type: string }
    GuildSummary:
      type: object
      required: [name, members, onlineMembers]
      properties:
        name: { type: string }
        members: { type: number }
        onlineMembers: { type: number }
    ModuleStatus:
      type: object
      required: [key, label, status, detail]
      properties:
        key: { type: string }
        label: { type: string }
        status: { type: string }
        detail: { type: string }
    Metrics:
      type: object
      required: [activeTickets, moderationActions, activeGiveaways, commandsToday]
      properties:
        activeTickets: { type: number }
        moderationActions: { type: number }
        activeGiveaways: { type: number }
        commandsToday: { type: number }
    GuildSettings:
      type: object
      required: [prefix, aiEnabled, automodEnabled, antiNukeEnabled, minecraftEnabled, ticketPanelChannel]
      properties:
        prefix: { type: string }
        aiEnabled: { type: boolean }
        automodEnabled: { type: boolean }
        antiNukeEnabled: { type: boolean }
        minecraftEnabled: { type: boolean }
        ticketPanelChannel: { type: string }
    GuildSettingsUpdate:
      type: object
      properties:
        prefix: { type: string, minLength: 1, maxLength: 3 }
        aiEnabled: { type: boolean }
        automodEnabled: { type: boolean }
        antiNukeEnabled: { type: boolean }
        minecraftEnabled: { type: boolean }
        ticketPanelChannel: { type: string }
    ModerationCase:
      type: object
      required: [id, action, user, moderator, reason, createdAt]
      properties:
        id: { type: string }
        action: { type: string }
        user: { type: string }
        moderator: { type: string }
        reason: { type: string }
        createdAt: { type: string }
    Ticket:
      type: object
      required: [id, number, category, subject, status, priority, assignee, createdAt]
      properties:
        id: { type: string }
        number: { type: number }
        category: { type: string }
        subject: { type: string }
        status: { type: string }
        priority: { type: string }
        assignee: { type: string }
        createdAt: { type: string }
    MinecraftStatus:
      type: object
      required: [online, players, maxPlayers, tps, mspt, ramUsed, ramTotal, cpu, uptime, version, world]
      properties:
        online: { type: boolean }
        players: { type: number }
        maxPlayers: { type: number }
        tps: { type: number }
        mspt: { type: number }
        ramUsed: { type: number }
        ramTotal: { type: number }
        cpu: { type: number }
        uptime: { type: string }
        version: { type: string }
        world: { type: string }
    EconomySummary:
      type: object
      required: [walletTotal, bankTotal, averageLevel, dailyStreak, topPlayers]
      properties:
        walletTotal: { type: number }
        bankTotal: { type: number }
        averageLevel: { type: number }
        dailyStreak: { type: number }
        topPlayers:
          type: array
          items:
            $ref: "#/components/schemas/LeaderboardEntry"
    LeaderboardEntry:
      type: object
      required: [rank, username, value]
      properties:
        rank: { type: number }
        username: { type: string }
        value: { type: number }
    ActivityItem:
      type: object
      required: [id, type, title, detail, timestamp]
      properties:
        id: { type: string }
        type: { type: string }
        title: { type: string }
        detail: { type: string }
        timestamp: { type: string }

